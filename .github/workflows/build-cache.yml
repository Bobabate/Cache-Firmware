name: Build Cache Firmware

# Mirrors Loon's board selector while adding tagged release publishing.

on:
  workflow_dispatch:
    inputs:
      boards:
        description: Boards to build
        required: true
        default: all
        type: choice
        options:
          - all
          - meshpocket
          - heltec-v3
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  choose-boards:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.value }}
    steps:
      - name: Select build matrix
        id: matrix
        shell: bash
        env:
          BOARD_CHOICE: ${{ github.event_name == 'push' && 'all' || inputs.boards }}
        run: |
          case "$BOARD_CHOICE" in
            all)
              value='[{"name":"MeshPocket","target":"Cache_mesh_pocket_room_server"},{"name":"Heltec-V3","target":"Cache_heltec_v3_room_server"}]'
              ;;
            meshpocket)
              value='[{"name":"MeshPocket","target":"Cache_mesh_pocket_room_server"}]'
              ;;
            heltec-v3)
              value='[{"name":"Heltec-V3","target":"Cache_heltec_v3_room_server"}]'
              ;;
            *)
              echo "Unknown board choice: $BOARD_CHOICE" >&2
              exit 1
              ;;
          esac
          echo "value=$value" >> "$GITHUB_OUTPUT"

  build:
    needs: choose-boards
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        board: ${{ fromJSON(needs.choose-boards.outputs.matrix) }}

    steps:
      - name: Check out Cache Firmware
        uses: actions/checkout@v6

      - name: Set up build environment
        uses: ./.github/actions/setup-build-environment

      - name: Report PlatformIO version
        run: pio --version

      - name: Build ${{ matrix.board.name }}
        env:
          FIRMWARE_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || format('workflow-{0}', github.run_number) }}
        run: ./build.sh build-firmware "${{ matrix.board.target }}"

      - name: Verify build output
        shell: bash
        env:
          TARGET: ${{ matrix.board.target }}
        run: |
          shopt -s nullglob
          files=(out/"$TARGET"-*)
          if (( ${#files[@]} == 0 )); then
            echo "No packaged firmware files were produced for $TARGET" >&2
            exit 1
          fi
          if [[ "$TARGET" == "Cache_heltec_v3_room_server" ]]; then
            bins=(out/"$TARGET"-*.bin)
            merged=(out/"$TARGET"-*-merged.bin)
            if (( ${#bins[@]} < 2 || ${#merged[@]} != 1 )); then
              echo "Heltec V3 build must contain application and merged BIN images" >&2
              exit 1
            fi
          else
            uf2=(out/"$TARGET"-*.uf2)
            zip=(out/"$TARGET"-*.zip)
            if (( ${#uf2[@]} != 1 || ${#zip[@]} != 1 )); then
              echo "MeshPocket build must contain one UF2 and one ZIP package" >&2
              exit 1
            fi
          fi
          sha256sum "${files[@]}" | tee out/SHA256SUMS.txt

      - name: Upload ${{ matrix.board.name }} firmware
        uses: actions/upload-artifact@v7
        with:
          name: Cache-${{ matrix.board.name }}-${{ github.ref_type == 'tag' && github.ref_name || format('workflow-{0}', github.run_number) }}
          path: out/
          if-no-files-found: error
          retention-days: 14

  release:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all firmware
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true

      - name: Create release checksums
        run: |
          rm -f release-assets/SHA256SUMS.txt
          cd release-assets
          find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -print0 \
            | sort -z \
            | xargs -0 sha256sum > SHA256SUMS.txt

      - name: Publish Cache Firmware release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" release-assets/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Cache Firmware ${GITHUB_REF_NAME}" \
            --notes "Cache Firmware release based on MeshCore Room Server for MeshPocket and Heltec V3. MeshPocket adds find acknowledgements, simplified first-admin notifications, and improved RSSI commands. Cache interaction remains MeshPocket-only; Heltec V3 retains baseline Room Server behaviour. Application updates preserve existing settings; merged Heltec V3 images are for clean/full installations."
