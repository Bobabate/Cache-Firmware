name: Publish Cache Firmware C2

on:
  push:
    branches:
      - cache/main
    paths:
      - .github/workflows/publish-cache-c2.yml

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download successful MeshPocket build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir release-assets
          gh run download 32442399870 \
            --repo "${GITHUB_REPOSITORY}" \
            --name Cache-MeshPocket-v1.17.1-C2 \
            --dir release-assets

      - name: Create release checksums
        run: |
          rm -f release-assets/SHA256SUMS.txt
          cd release-assets
          find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -print0 \
            | sort -z \
            | xargs -0 sha256sum > SHA256SUMS.txt

      - name: Publish Cache Firmware release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.17.1-C2 release-assets/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Cache Firmware v1.17.1-C2" \
            --notes "MeshPocket-only Cache Firmware release based on MeshCore Room Server. Heltec V3 remains at v1.17.1-C1."
